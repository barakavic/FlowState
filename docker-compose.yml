

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: flowstate_user
      POSTGRES_PASSWORD: flowstate_password
      POSTGRES_DB: flowstate_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstate_user -d flowstate_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://flowstate_user:flowstate_password@db:5432/flowstate_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
